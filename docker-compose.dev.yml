version: '3.8'
# tensorboard --logdir s3://ray/traffic 

services:
  db:
    image: postgres:16.10
    # ports:
    #     - 5432:5432
    volumes:
        - ./docker_stuff/postgress_folder:/var/lib/postgresql/data
    restart: always
    networks:
      - bridge_1492_67
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
      #LANG: ru_RU.UTF8
      #POSTGRES_INITDB_ARGS: --locale-provider icu --icu-locale ru_RU --encoding UTF8
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=16MB
      -c maintenance_work_mem=128MB
      -c synchronous_commit=off
      -c wal_compression=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    networks:
      - bridge_1492_67
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - AUTH_TYPE=scram-sha-256
    # restart: always

  optuna-proxies:
    image: ${MAIN_DOCKER_IMAGE}
    networks:
      - bridge_1492_67
    depends_on:
      - pgbouncer
    environment:
      - OPTUNA_PROXY_PORT_MIN=${OPTUNA_PROXY_PORT_MIN:-13001}
      - OPTUNA_PROXY_PORT_MAX=${OPTUNA_PROXY_PORT_MAX:-13004}
      - OPTUNA_PROXY_THREAD_POOL_SIZE=${OPTUNA_PROXY_THREAD_POOL_SIZE:-32}
      - OPTUNA_DB_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
    volumes:
      - ./docker_stuff:/workspace:cached
    working_dir: /workspace
    command: >
      bash -c "python tools/run_optuna_proxies.py"
    # restart: always




  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard
    depends_on:
      pgbouncer:
        condition: service_started
    networks:
      - bridge_1492_67
    ports:
      - "127.0.0.1:8090:8080"
    command:
      - "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}"

  traffic_rl:
    image: ${MAIN_DOCKER_IMAGE}
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      network: host
      args:
        UID: ${UID}
        GID: ${GID}
    user: "${UID}:${GID}"
    ports:
      # - 13000:13000
      - 9966:9966
    environment:
      - UID=${UID}
      - GID=${GID}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_USE_HTTPS=${S3_USE_HTTPS}
      - S3_VERIFY_SSL=${S3_VERIFY_SSL}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_USER=${REDIS_USER}
      - REDIS_USER_PASSWORD=${REDIS_USER_PASSWORD}

      

    
    volumes:
      - .:/workspace:cached

    env_file:
      - .env
    

    # depends_on:
    #   - mongodb
    shm_size: "20G"
    command: sleep infinity

    networks:
      - bridge_1492_69
      # - win_prob_ray_network

  optuna-lb:
    image: haproxy:2.9
    networks:
      - bridge_1492_67
      # - win_prob_ray_network
    depends_on:
      - optuna-proxies
    environment:
      - OPTUNA_PROXY_PORT_MIN=${OPTUNA_PROXY_PORT_MIN:-13001}
      - OPTUNA_PROXY_PORT_MAX=${OPTUNA_PROXY_PORT_MAX:-13004}
      - OPTUNA_PROXY_HOST=optuna-proxies
      - OPTUNA_PROXY_THREAD_POOL_SIZE=${OPTUNA_PROXY_THREAD_POOL_SIZE:-32}
    volumes:
      - ./docker_stuff/tools/haproxy-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    # ports:
    #   - "13000:13000"
    restart: always

networks:
  bridge_1492_67:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1492
  # win_prob_ray_network:
  #   external: true
  #   name: win_prob_ray_network


