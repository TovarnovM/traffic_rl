[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snfs-traffic"
version = "1.1.0"
description = "Revised S-NFS traffic simulation and priority-vehicle reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.optional-dependencies]
viz = [
    "pygame>=2.5",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4",
    "matplotlib>=3.8",
]
numba = [
    "numba>=0.61",
]
rl = [
    "gymnasium>=0.29",
]
infra = [
    "optuna>=3.6",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]
ray = [
    "ray[rllib]>=2.9,<3",
    "torch>=2.2",
]
