[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snfs-traffic"
version = "0.1.0"
description = "High-performance Revised S-NFS traffic simulator for future multi-agent reinforcement learning experiments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
